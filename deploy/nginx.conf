# Nginx site for the API, e.g. /etc/nginx/sites-available/api.hscodematch.com
# Get a certificate first: sudo certbot --nginx -d api.hscodematch.com

server {
    listen 80;
    server_name api.hscodematch.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.hscodematch.com;

    ssl_certificate     /etc/letsencrypt/live/api.hscodematch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hscodematch.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
